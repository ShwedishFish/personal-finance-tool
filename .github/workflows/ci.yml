name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q

  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Launcher starts the app (macOS)
        if: runner.os == 'macOS'
        run: |
          ("./Start Personal Finance.command" > launcher.log 2>&1 &)
          for _ in $(seq 180); do
            curl -fsS http://127.0.0.1:8020/api/health && exit 0
            sleep 1
          done
          cat launcher.log; exit 1
      - name: Launcher starts the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath "Start Personal Finance.bat" -WorkingDirectory $PWD -RedirectStandardOutput launcher.log -NoNewWindow
          for ($i = 0; $i -lt 180; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8020/api/health | Out-Null; exit 0 } catch { Start-Sleep 1 }
          }
          Get-Content launcher.log; exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
